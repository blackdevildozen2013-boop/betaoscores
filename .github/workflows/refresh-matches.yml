name: Refresh Bettao match data
on:
  schedule:
    - cron: '17 12 * * *' # Daily, UTC. GitHub schedules may run late or be skipped.
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bettao-match-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and sanitize API data
        env:
          REALTIME_SPORTS_API_KEY: ${{ secrets.REALTIME_SPORTS_API_KEY }}
        run: python scripts/fetch_matches.py
      - name: Commit updated data and request ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/matches.json data/request-ledger.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Bettao cached match data"
            git push
          fi
